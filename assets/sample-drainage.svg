<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#1e293b"/>
  <!-- Sidewalk -->
  <rect x="0" y="0" width="600" height="180" fill="#475569"/>
  <line x1="0" y1="180" x2="600" y2="180" stroke="#94a3b8" stroke-width="6"/>
  
  <!-- Open Broken Manhole -->
  <ellipse cx="280" cy="180" rx="75" ry="40" fill="#020617" stroke="#334155" stroke-width="6"/>
  <!-- Displaced heavy cast iron lid leaning -->
  <ellipse cx="370" cy="195" rx="70" ry="36" fill="#0f172a" stroke="#64748b" stroke-width="6" transform="rotate(-15 370 195)"/>
  
  <!-- Murky Flooded Sewage Water Spreading -->
  <path d="M 160,200 C 200,280 140,360 280,380 C 420,400 520,320 480,220 C 440,160 380,240 280,220 Z" fill="#0369a1" opacity="0.7"/>
  <path d="M 220,240 C 260,300 320,330 380,260 Z" fill="#082f49" opacity="0.9"/>
  
  <!-- Ripple rings -->
  <ellipse cx="280" cy="280" rx="40" ry="15" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <ellipse cx="280" cy="280" rx="70" ry="25" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Detection Watermark -->
  <rect x="20" y="20" width="240" height="40" rx="8" fill="rgba(15, 23, 42, 0.8)"/>
  <text x="35" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#06b6d4">🌊 DRAINAGE OVERFLOW</text>
</svg>

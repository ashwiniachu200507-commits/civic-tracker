<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="asphalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="potholeHole" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>
    <linearGradient id="roadLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  
  <!-- Road Surface -->
  <rect width="600" height="400" fill="url(#asphalt)"/>
  
  <!-- Road Markings -->
  <rect x="0" y="190" width="140" height="16" fill="url(#roadLine)" opacity="0.8"/>
  <rect x="220" y="190" width="160" height="16" fill="url(#roadLine)" opacity="0.8"/>
  <rect x="460" y="190" width="140" height="16" fill="url(#roadLine)" opacity="0.8"/>
  
  <!-- Deep Pothole Crater Shape -->
  <path d="M 180,240 C 140,260 160,330 260,340 C 360,350 440,320 460,260 C 480,200 420,160 320,170 C 220,180 200,220 180,240 Z" fill="url(#potholeHole)"/>
  
  <!-- Cracks around pothole -->
  <path d="M 180,240 L 130,220 M 160,300 L 100,340 M 380,180 L 440,120 M 460,270 L 520,310 M 340,340 L 360,380" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Loose Gravel Pebbles -->
  <circle cx="210" cy="270" r="5" fill="#64748b"/>
  <circle cx="390" cy="240" r="7" fill="#475569"/>
  <circle cx="290" cy="290" r="8" fill="#334155"/>
  <circle cx="340" cy="220" r="6" fill="#64748b"/>
  <circle cx="160" cy="230" r="4" fill="#94a3b8"/>
  
  <!-- Detection Watermark -->
  <rect x="20" y="20" width="220" height="40" rx="8" fill="rgba(15, 23, 42, 0.8)"/>
  <text x="35" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#38bdf8">🕳️ POTHOLE EVIDENCE</text>
</svg>

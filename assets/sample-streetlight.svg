<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <!-- Night Background -->
  <rect width="600" height="400" fill="url(#nightSky)"/>
  
  <!-- Street Floor -->
  <rect x="0" y="320" width="600" height="80" fill="#1e293b"/>
  <rect x="0" y="315" width="600" height="6" fill="#334155"/>
  
  <!-- Streetlight Pole -->
  <path d="M 280,330 L 290,100 Q 295,40 370,40 L 400,40" stroke="#475569" stroke-width="14" fill="none" stroke-linecap="round"/>
  
  <!-- Non-functional Light Fixture (Dark/Red Blink) -->
  <path d="M 380,40 L 420,40 L 410,75 L 390,75 Z" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <circle cx="400" cy="70" r="10" fill="#ef4444" opacity="0.8"/>
  
  <!-- Warning Sparks / Broken wire -->
  <path d="M 400,75 L 405,95 L 395,105" stroke="#ef4444" stroke-width="3" fill="none"/>
  
  <!-- Detection Watermark -->
  <rect x="20" y="20" width="240" height="40" rx="8" fill="rgba(15, 23, 42, 0.8)"/>
  <text x="35" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#facc15">💡 BROKEN STREETLIGHT</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0f172a"/>
  
  <!-- Pole -->
  <rect x="285" y="150" width="30" height="250" fill="#475569"/>
  
  <!-- Traffic Light Housing -->
  <rect x="240" y="40" width="120" height="240" rx="20" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  
  <!-- Red Light (Off) -->
  <circle cx="300" cy="90" r="28" fill="#450a0a" stroke="#7f1d1d" stroke-width="2"/>
  
  <!-- Amber Light (Blinking Warning) -->
  <circle cx="300" cy="160" r="28" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
  <circle cx="300" cy="160" r="38" fill="none" stroke="#facc15" stroke-width="2" opacity="0.6"/>
  <circle cx="300" cy="160" r="48" fill="none" stroke="#facc15" stroke-width="1" opacity="0.3"/>
  
  <!-- Green Light (Off) -->
  <circle cx="300" cy="230" r="28" fill="#052e16" stroke="#14532d" stroke-width="2"/>
  
  <!-- Hanging wires -->
  <path d="M 240,160 Q 210,200 220,240" stroke="#ef4444" stroke-width="4" fill="none"/>
  
  <!-- Detection Watermark -->
  <rect x="20" y="20" width="240" height="40" rx="8" fill="rgba(15, 23, 42, 0.8)"/>
  <text x="35" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#f87171">🚦 SIGNAL MALFUNCTION</text>
</svg>
